name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Sound
        2. Drop a file at …
        3. Press Play
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Earshot version
      description: The image tag you run, or the version from `/api/health`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 142 on macOS 26
    validations:
      required: true
  - type: input
    id: headphones
    attributes:
      label: Headphones (for audio problems)
      description: Model, and whether any spatial audio or virtual surround feature is switched on.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console output and `docker logs earshot`, if relevant.
      render: text
